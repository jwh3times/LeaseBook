## Documentation topology

**Every committed canonical document is listed here, and that is enforced.** `scripts/check-docs.mjs`
fails the build when a canonical doc is missing from this block — because an omission here is
invisible: you cannot audit a file you were never told exists. `docs/runbooks/diagnostics.md` was
absent from this list for months and was silently skipped by every audit in that window.

Canonical = every committed `*.md` at the repo root, under `docs/`, under `infra/`, or in
`.claude/agents/`, except the individual `docs/adr/ADR-*.md` records (the ADR index rule covers
those). Add a line here in the same change that adds a document.

