# Dependabot version updates. Keeps every dependency ecosystem in the repo current.
# Security updates are enabled separately in repo Settings → Code security; the daily
# version-update sweep below also picks up fixed advisories as they ship.
#
# Noise control: minor + patch bumps are grouped into one PR per ecosystem; major
# versions open individual PRs — EXCEPT for peer-locked families where a lone bump
# would leave an unsatisfiable peer range. Those families travel together as one major PR.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # .NET — host + module projects + tests. NuGet discovery walks the repo from root and
  # finds every *.csproj referenced by LeaseBook.slnx (src/ and tests/).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "build(deps)"
    groups:
      dotnet-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # React + TypeScript SPA (package.json / package-lock.json live in web/).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "build(deps)"
    groups:
      # --- Peer-locked families — majors only. All minor/patch bumps land in the
      #     catch-all group at the bottom. ---

      # react + react-dom ship at identical versions and must match at runtime;
      # the @types/* packages track the same major.
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"

      # @tanstack/react-query, -devtools, and react-virtual all require a compatible
      # @tanstack core — major bumps typically ship across the family at once.
      tanstack:
        applies-to: version-updates
        patterns:
          - "@tanstack/*"
        update-types:
          - "major"

      # @vitejs/plugin-react requires a matching Vite major; vitest and @vitest/*
      # track the Vite majors they support.
      vite-ecosystem:
        applies-to: version-updates
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/plugin-react"
          - "@vitest/*"
        update-types:
          - "major"

      # @testing-library/react and user-event both peer-require @testing-library/dom.
      testing-library:
        applies-to: version-updates
        patterns:
          - "@testing-library/*"
        update-types:
          - "major"

      # Oxlint delegates type-aware rules to tsgolint; keep their compiler-facing majors aligned.
      oxlint:
        applies-to: version-updates
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
        update-types:
          - "major"

      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Hey API code generation is isolated from the SPA because the generator still uses the
  # JavaScript compiler API removed by native TypeScript 7. Keep its TS 5 toolchain independently
  # reproducible until Hey API can execute under TS 7.
  - package-ecosystem: "npm"
    directory: "/web/codegen"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "build(codegen)"
    groups:
      hey-api-codegen:
        patterns:
          - "@hey-api/*"
          - "typescript"
    # This ignore is open-ended, so the codegen-unblock-watch workflow runs the real generator
    # weekly against the compiler major the SPA declares and opens a tracking issue once it stops
    # crashing. Remove this entry then and let Dependabot re-propose the major (ADR-030).
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # Base images in the production Dockerfile (FROM lines).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Service images in docker-compose.yml (postgres, pgadmin). Separate ecosystem from
  # "docker" since GA in Feb 2025.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker-compose"
    commit-message:
      prefix: "build(deps)"
    groups:
      compose-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Action versions pinned in .github/workflows/*.yml (ci, deploy-dev, deploy-prod).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
