name: Version

# Releases every merge to main with a three-part SemVer tag (`Scheme: stamp-on-tag`, ADR-058).
#
# On each push to main this runs `scripts/stamp-changelog.mjs`, which walks main's first-parent
# history back to the newest `v<major>.<minor>.<build>` tag and, for each untagged merge, oldest
# first:
#   - builds its dated CHANGELOG.md section from the `changelog.d/` fragments that merge added, or
#     from its PR title when it added none (a Dependabot PR, a docs-only change);
#   - computes its version the way `scripts/next-version.mjs` does, from the root VERSION file at
#     that merge and the tags so far (a new major/minor line starts at its `x.y.0` as written);
#   - tags the merge commit itself, so a tag is exactly the code that merge built.
# It makes one stamp commit, `chore(release): v<x.y.z>[, ...] [skip ci]`, that adds the sections
# and their footer links and deletes the used fragments. This job pushes that commit and the tags
# in one atomic push, then creates a GitHub Release per tag from its section.
#
# The push uses a token from the release GitHub App, which the main ruleset lists as its one bypass
# actor: `GITHUB_TOKEN` cannot bypass a ruleset. The App's client ID is the RELEASE_APP_CLIENT_ID
# variable and its private key the RELEASE_APP_PRIVATE_KEY secret. `[skip ci]` keeps the App's push
# from starting CI, Coverage, Docs links or this workflow again. Deploy (dev) follows CI's run on
# the merge through `workflow_run` and checks out that run's commit, so it never builds a stamp
# commit, though main's tip is the stamp commit by the time it starts.
#
# To see which release a checkout corresponds to: git describe --tags

on:
  push:
    branches: [main]

permissions:
  contents: write # gh release create with GITHUB_TOKEN

# Runs take turns and never cancel: a run waiting here starts from main's new tip and stamps every
# merge the run before it did not.
concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  release:
    name: Stamp changelog and tag
    runs-on: ubuntu-latest
    # Typically under a minute. See ci.yml for why every job carries a bound.
    timeout-minutes: 10
    steps:
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # main's tip, not the pushed commit: a later merge may already be on it
          fetch-depth: 0 # full history and tags, needed to find the untagged merges
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Stamp the changelog and push the tags
        id: stamp
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"

          node scripts/stamp-changelog.mjs --notes-dir "$RUNNER_TEMP/notes" > "$RUNNER_TEMP/tags.txt"
          if [ ! -s "$RUNNER_TEMP/tags.txt" ]; then
            echo "Every merge on main is tagged; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tags=$(cut -d' ' -f1 "$RUNNER_TEMP/tags.txt")

          refs=()
          for tag in $tags; do refs+=("refs/tags/${tag}"); done
          if ! git push --atomic origin HEAD:main "${refs[@]}" 2> "$RUNNER_TEMP/push.log"; then
            cat "$RUNNER_TEMP/push.log" >&2
            # Only main moving is benign: the run waiting behind this one stamps both merges.
            if grep -Eq 'HEAD -> main \((fetch first|non-fast-forward)\)' "$RUNNER_TEMP/push.log"; then
              echo "::notice::main moved during this run; the next run releases these merges."
              exit 0
            fi
            exit 1
          fi
          cat "$RUNNER_TEMP/push.log" >&2
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Releases
        if: steps.stamp.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "### Released" >> "$GITHUB_STEP_SUMMARY"
          while read -r tag sha; do
            gh release create "$tag" \
              --verify-tag \
              --title "LeaseBook ${tag#v}" \
              --notes-file "$RUNNER_TEMP/notes/${tag}.md"
            echo "- \`${tag}\` on \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/tags.txt"
