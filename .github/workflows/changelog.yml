name: Changelog

# Enforces the CHANGELOG cut policy: a PR that changes product source (src/** or web/src/**)
# must add to the [Unreleased] section, unless the PR is the deliberate major/minor cut that moves
# [Unreleased] into a matching dated section. Per-merge build tags don't get their own sections —
# they roll up into the next deliberate cut (see CHANGELOG.md and .claude/skills/ship/SKILL.md).
#
# Exemptions: dependabot (its bumps roll up into the next cut) and a visible `skip-changelog`
# label (for product-source changes with no user-visible effect, e.g. a pure refactor).
#
# The job always runs so branch protection always gets a conclusion; mark
# "CHANGELOG [Unreleased] updated" a required status check on main for this to enforce.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: CHANGELOG [Unreleased] updated
    runs-on: ubuntu-latest
    # Typically ~5 s (a checkout and a diff). See ci.yml for why every job carries a bound.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need base + head commits to diff the [Unreleased] section

      - name: Require an [Unreleased] entry for product-source changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -uo pipefail

          # Dependabot bumps roll up into the next release cut — no [Unreleased] entry required.
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "Author is dependabot[bot]; changelog entry not required."
            exit 0
          fi

          # Explicit, visible escape hatch for product-source changes with no user-visible effect.
          if [[ ",${PR_LABELS}," == *",skip-changelog,"* ]]; then
            echo "skip-changelog label present; changelog entry not required."
            exit 0
          fi

          # Only product-source changes must be documented; docs/CI/test-only PRs are exempt.
          needs_entry=false
          while IFS= read -r f; do
            case "$f" in
              src/* | web/src/*) needs_entry=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          if [[ "$needs_entry" != true ]]; then
            echo "No changes under src/ or web/src/; changelog entry not required."
            exit 0
          fi

          # A deliberate major/minor cut empties [Unreleased], so comparing that section alone would
          # reject the exact shape the cut policy requires. Accept only the next x.y.0 line, with a
          # new, non-empty dated section and links that all name the same version.
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- VERSION; then
            base_version="$(git show "$BASE_SHA:VERSION" 2>/dev/null | tr -d '\r\n')"
            head_version="$(git show "$HEAD_SHA:VERSION" 2>/dev/null | tr -d '\r\n')"
            valid_next_line=false

            if [[ "$base_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              base_major=$((10#${BASH_REMATCH[1]}))
              base_minor=$((10#${BASH_REMATCH[2]}))
              if [[ "$head_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                head_major=$((10#${BASH_REMATCH[1]}))
                head_minor=$((10#${BASH_REMATCH[2]}))
                head_patch=$((10#${BASH_REMATCH[3]}))
                if (( head_patch == 0 )) &&
                   { (( head_major == base_major && head_minor == base_minor + 1 )) ||
                     (( head_major == base_major + 1 && head_minor == 0 )); }; then
                  valid_next_line=true
                fi
              fi
            fi

            head_changelog="$(git show "$HEAD_SHA:CHANGELOG.md" 2>/dev/null || true)"
            base_changelog="$(git show "$BASE_SHA:CHANGELOG.md" 2>/dev/null || true)"
            escaped_version="${head_version//./\\.}"
            release_body="$(printf '%s\n' "$head_changelog" | awk -v prefix="## [$head_version] - " '
              index($0, prefix) == 1 { capture = 1; next }
              /^## \[/ && capture   { exit }
              capture               { print }
            ')"
            release_entry="$(printf '%s\n' "$release_body" | grep -E '^- ' | grep -Fvx -- '- _Nothing yet._' || true)"

            # Here-strings keep grep from closing a printf producer early under pipefail. A valid
            # match near the top of a long changelog must not turn into a broken-pipe failure.
            if [[ "$valid_next_line" == true ]] &&
               grep -Eq "^## \\[${escaped_version}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" <<<"$head_changelog" &&
               ! grep -Fq "## [$head_version] - " <<<"$base_changelog" &&
               [[ -n "$release_entry" ]] &&
               grep -Fqx "[Unreleased]: https://github.com/${GITHUB_REPOSITORY}/compare/v${head_version}...HEAD" <<<"$head_changelog" &&
               grep -Fqx "[$head_version]: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${head_version}" <<<"$head_changelog"; then
              echo "Valid deliberate release cut from $base_version to $head_version."
              exit 0
            fi

            echo "::error file=CHANGELOG.md::VERSION changed from '$base_version' to '$head_version', but the deliberate release cut is incomplete or invalid. Use the next major/minor x.y.0 line, add a new non-empty dated section, and update both release links."
            exit 1
          fi

          # The [Unreleased] section body at a ref: lines after '## [Unreleased]' up to the next
          # '## [' heading. Comparing base vs head is not fooled by edits to an older section.
          extract_unreleased() {
            git show "$1:CHANGELOG.md" 2>/dev/null | awk '
              /^## \[Unreleased\]/ { capture = 1; next }
              /^## \[/ && capture   { exit }
              capture               { print }
            ' || true
          }

          if [[ "$(extract_unreleased "$BASE_SHA")" == "$(extract_unreleased "$HEAD_SHA")" ]]; then
            echo "::error file=CHANGELOG.md::This PR changes src/ or web/src/ but the [Unreleased] section is unchanged. Add an entry (run /ship), or apply the 'skip-changelog' label if there is no user-visible change."
            exit 1
          fi

          echo "CHANGELOG [Unreleased] section updated."
