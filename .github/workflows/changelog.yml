name: Changelog

# Guards the changelog under `Scheme: stamp-on-tag` (ADR-058).
#
# No branch names a version or edits CHANGELOG.md's sections: each writes its entries to its own
# `changelog.d/<branch-slug>.md` fragment, and version.yml stamps them into the merge's dated
# section after it lands. scripts/check-changelog.mjs fails a PR that adds, removes or renumbers a
# version section, adds entries to `## [Unreleased]`, edits or deletes a fragment already on main
# (it belongs to the merge that added it), or adds a fragment that does not parse. A PR with no
# fragment passes: its merge gets a one-bullet section from its PR title, so Dependabot PRs run the
# same check with no exemption.
#
# The job keeps its name from the accumulator policy (ADR-024): the ruleset requires
# "CHANGELOG [Unreleased] updated" by name, and a renamed job would leave that check pending.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: CHANGELOG [Unreleased] updated
    runs-on: ubuntu-latest
    # Typically ~10 s (a checkout and a tag fetch). See ci.yml for why every job carries a bound.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags, to diff the branch against its merge base

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Check the changelog and fragments
        run: node scripts/check-changelog.mjs
