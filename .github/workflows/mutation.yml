name: Mutation (nightly)

# Mutation testing on the two modules where a wrong answer is a fiduciary error (ADR-055 addendum,
# docs/testing/mutation.md). Stryker.NET changes the module's code one small edit at a time and
# reruns the module's fast test project against each edit. An edit no test notices survived, and is
# listed in the job summary: either a gap in the tests or an edit that changes nothing observable,
# which is recorded with its reason in tests/mutation/equivalent-mutants.json.
#
# Report, then fail. A module's gate in that file is off while it has unexplained survivors, and the
# job then only reports. Once a module is clean its gate is turned on, and from then an unexplained
# survivor fails its job. Both gates ship off. The job also fails when Stryker itself fails.
#
# It never runs on pull requests: a full run of Accounting takes hours. Each module is mutated
# against its own test project, which needs Docker for its Postgres container (Testcontainers), as
# the Backend job of ci.yml does.
on:
  # TEMPORARY, reverted before merge: a first real run on this branch, since a workflow not yet on
  # the default branch cannot be dispatched.
  push:
    branches: [mutation-nightly]
  schedule:
    # Nightly at 00:17 UTC, off the top of the hour, when scheduled workflows queue longest. Even at
    # the longest timeout it ends before the Coverage (e2e) workflow at 06:23 and the production
    # invariant sweep at 07:00, so the three never share a night's runners.
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      module:
        description: Which module to mutate
        type: choice
        options: [both, accounting, payments]
        default: both

permissions:
  contents: read

# A run that is still going is not cancelled by the next one: an Accounting run cancelled at hour
# four reports nothing. The newer run waits instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation (${{ matrix.job.name }})
    runs-on: ubuntu-latest
    strategy:
      # Payments is one job and Accounting two, all in parallel, so no run holds up another and a
      # failure in one does not cancel the rest. A scheduled run has no input and runs all three.
      #
      # Accounting is split because a whole run took 296 min on a hosted runner, against GitHub's
      # 360-minute limit for a job, and a job that times out reports nothing. Part 1 mutates the
      # directories scripts/mutation.mjs names and part 2 the rest of the module, about half the
      # mutants each. Payments took 88 min, and part 2 two hours. Each part gets 300 min: part 1
      # once took four hours, when mutants in static initializers made 146 others time out, before
      # those mutants were disabled (docs/testing/mutation.md). Re-measure after the scheduled runs.
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.module == 'accounting' && '[{"name":"accounting, part 1","args":"accounting --part 1","out":"accounting-1","timeout":300},{"name":"accounting, part 2","args":"accounting --part 2","out":"accounting-2","timeout":300}]' || inputs.module == 'payments' && '[{"name":"payments","args":"payments","out":"payments","timeout":180}]' || '[{"name":"accounting, part 1","args":"accounting --part 1","out":"accounting-1","timeout":300},{"name":"accounting, part 2","args":"accounting --part 2","out":"accounting-2","timeout":300},{"name":"payments","args":"payments","out":"payments","timeout":180}]') }}
    timeout-minutes: ${{ matrix.job.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # Restores dotnet-stryker with the other local tools (.config/dotnet-tools.json).
      - run: dotnet tool restore
      # Runs Stryker from the module's test project with its stryker-config.json and writes the
      # summary. Node is the runner image's own; the script uses nothing newer than Node 20. The
      # exit code is the gate: non-zero only when Stryker failed, or when the module's gate is on and
      # a survivor is unexplained.
      - name: Run Stryker and summarise what survived
        run: node scripts/mutation.mjs ${{ matrix.job.args }} --concurrency 4 --out-md "StrykerOutput/summary-${{ matrix.job.out }}.md"
      # Written before the gate fails the job, so a red run still lists its survivors. A missing
      # summary is a run that did not report, and fails here too.
      - name: Publish the mutation summary
        if: ${{ !cancelled() }}
        run: cat "StrykerOutput/summary-${{ matrix.job.out }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Stryker reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.job.out }}
          # reports/mutation-report.html is the report to open; mutation-report.json is what the
          # summary was read from.
          path: |
            StrykerOutput/summary-${{ matrix.job.out }}.md
            StrykerOutput/${{ matrix.job.out }}/reports/
          if-no-files-found: error
          retention-days: 14
