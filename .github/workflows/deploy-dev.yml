name: Deploy (dev)

# Runs after CI succeeds on main. Requires the operator to have configured the dev environment's
# OIDC federated credentials and ACR/Container App vars (this workflow is authored but its
# enablement is deferred — see Status Ledger). Until that is done the automatic path SKIPS rather
# than fails; see the guard on the job below for why, and for how it un-mutes itself.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # The automatic (workflow_run) path additionally requires the dev environment to actually be
  # configured. Until the operator sets ACR_NAME — part of the same B1 step that creates the OIDC
  # federated credentials — this job is SKIPPED rather than run, because `azure/login` would fail on
  # every merge to main with "Ensure 'client-id' and 'tenant-id' are supplied". A permanent red X on
  # every merge is worse than no signal: it trains everyone to ignore CI, and it hides a real deploy
  # failure when one eventually happens.
  #
  # The guard un-mutes itself. Setting ACR_NAME is not optional for a working deploy, so the first
  # run after the operator configures the environment picks this up with no code change and no one
  # having to remember this comment exists.
  #
  # A MANUAL dispatch deliberately skips the guard: if someone explicitly asks for a deploy, they
  # want a loud failure telling them what is missing, not silence.
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.ACR_NAME != '') }}
    runs-on: ubuntu-latest
    # Unmeasured — this workflow is still operator-gated and has never run, so this is a ceiling
    # rather than a fitted bound. An image build, an ACR push, `dotnet ef database update`, and a
    # revision update have no unbounded wait between them. Waiting for environment approval is not
    # charged against this. See ci.yml for why every job carries a bound.
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_NAME.azurecr.io/leasebook:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}

      # This connection leaves a GitHub-hosted runner, crosses the public internet and carries the
      # schema-owner credential, so it is the one place where an unverified TLS peer matters most.
      # The application's own startup guard cannot cover it: `dotnet ef database update` builds the
      # host at design time and never reaches the lifecycle that runs ProductionSecurityGuards.
      #
      # The secret is matched, never printed. A failure here reports only which check failed.
      - name: Require certificate-verifying TLS on the migrations connection
        run: /bin/sh ./infra/migrator/require-verified-postgres-tls.sh
        env:
          ConnectionStrings__Migrations: ${{ secrets.MIGRATIONS_CONNECTION_STRING }}

      # Migrations run as the migrator role from a one-shot job — never by the running app (§C.5).
      - name: Apply EF migrations
        run: |
          dotnet tool restore
          dotnet restore src/LeaseBook.Web
          dotnet ef database update --project src/LeaseBook.Web --context AppDbContext
        env:
          ConnectionStrings__Migrations: ${{ secrets.MIGRATIONS_CONNECTION_STRING }}

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/leasebook:${{ github.sha }}"
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
