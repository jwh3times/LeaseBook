name: Docs links

# Conventional-CI complement to the session-scoped docs-drift check in the /ship skill: that check
# only runs in Claude Code sessions, so Dependabot merges, Codex sessions, and manual edits bypass
# it. This job catches broken links/anchors on every docs change, and the weekly run catches
# external link rot.
on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/docs-links.yml'
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — external link rot sweep

permissions:
  contents: read

jobs:
  lychee:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    # Talks to arbitrary third-party hosts, so it is the one job whose failures can originate
    # outside the repository. See the concurrency note on the args below.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare current-release link exclusions
        id: release-links
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error file=VERSION::Version '$version' must be plain SemVer."
            exit 1
          fi

          # A major/minor PR cuts the changelog before the merge-only release workflow creates
          # its tag. Push workflows can race that tag too. Exclude only those two current-version
          # URLs there; the weekly sweep uses a never-matching regex and checks every release link.
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo 'compare=^$' >> "$GITHUB_OUTPUT"
            echo 'release=^$' >> "$GITHUB_OUTPUT"
          else
            echo "compare=^https://github\\.com/jwh3times/LeaseBook/compare/v${version}\\.\\.\\.HEAD$" >> "$GITHUB_OUTPUT"
            echo "release=^https://github\\.com/jwh3times/LeaseBook/releases/tag/v${version}$" >> "$GITHUB_OUTPUT"
          fi
      - uses: lycheeverse/lychee-action@v2
        env:
          # Authenticates github.com link checks (avoids rate-limit 403s).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail: true
          # Explicit include list = the tracked docs set (never node_modules/bin/obj strays).
          # --include-fragments validates intra-repo #anchor links.
          # localhost/loopback URLs are dev-runbook examples, not checkable links.
          # --max-concurrency: lychee defaults to 128, firing every link at once. Several docs
          # cite the same host repeatedly (CODE_OF_CONDUCT.md alone has five contributor-covenant.org
          # links), so the default turns one host into a burst of simultaneous connections from a
          # datacenter IP — which reads as scraping and gets the TCP connection reset rather than a
          # 429 we could accept. That is the failure this cap addresses: `Connection reset by peer
          # (os error 104)`, which failed three of four runs on PRs #233/#234 while the same URL
          # answered 301 from a laptop. 16 keeps the sweep well under a minute.
          #
          # --retry-wait-time: lychee already retries 3x, but at 1 s apart all three land inside the
          # same throttling window. 3 s spreads them across ~9 s instead.
          #
          # Deliberately NOT an --exclude: muting the URL would also stop reporting it when it
          # genuinely rots, and this repository does not add open-ended ignores without an un-mute
          # signal. If resets persist despite this, the next step is a scoped exclude PLUS a check
          # that fails when the excluded link starts working again.
          args: >-
            --no-progress
            --include-fragments
            --max-concurrency 16
            --retry-wait-time 3
            --accept '200..=299, 429'
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '${{ steps.release-links.outputs.compare }}'
            --exclude '${{ steps.release-links.outputs.release }}'
            'README.md' 'CHANGELOG.md' 'CONTRIBUTING.md' 'SECURITY.md' 'SUPPORT.md'
            'CODE_OF_CONDUCT.md' 'AGENTS.md' 'CLAUDE.md'
            'docs/**/*.md' 'infra/**/*.md' '.github/**/*.md' '.claude/**/*.md'
