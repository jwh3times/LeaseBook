name: Docs links

# Conventional-CI complement to the session-scoped docs-drift check in the /ship skill: that check
# only runs in Claude Code sessions, so Dependabot merges, Codex sessions, and manual edits bypass
# it. This job catches broken links/anchors on every docs change, and the weekly run catches
# external link rot.
on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/docs-links.yml'
      - 'scripts/challenged-links.mjs'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/docs-links.yml'
      - 'scripts/challenged-links.mjs'
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — external link rot sweep
  workflow_dispatch: {} # runs the sweep by hand, so a change to it need not wait for Monday

permissions:
  contents: read

jobs:
  lychee:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    # Talks to arbitrary third-party hosts, so it is the one job whose failures can originate
    # outside the repository. See the concurrency note on the args below.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Prepare link exclusions
        id: link-exclusions
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error file=VERSION::Version '$version' must be plain SemVer."
            exit 1
          fi

          # A major/minor PR cuts the changelog before the merge-only release workflow creates
          # its tag. Push workflows can race that tag too. Exclude only those two current-version
          # URLs there; the weekly sweep uses a never-matching regex and checks every release link.
          #
          # stalling: one cited page, the FSF font-exception FAQ, intermittently never answers a
          # given runner. Each failure (main on 2026-10-03, PRs #489 and #493) spent the whole
          # ~60 s of timeout-and-retries on it alone, in a branch that did not touch the citing
          # file, and a re-run minutes later on another runner checked all 480-odd links in 4 s.
          # The same page answers a laptop in 0.2 s. A stall that follows the runner is not cured
          # by a longer timeout or by retries from that runner, so this URL is checked by the
          # weekly sweep instead of on every PR and push. It is still checked, anchor included:
          # if the page or its #FontException anchor rots, Monday's run fails. The pattern names
          # the one URL, not the host, so a new gnu.org link is checked everywhere.
          #
          # refusing: four links in docs/research/micr-e13b-refund-checks.md that a runner is
          # sometimes refused, in branches that did not touch the file (#540). The ABA routing
          # number policy PDF answered 403 on PRs #508 and #537 and on main at dde90cf; the two
          # Internet Archive copies of GnuMICR answered 503 on main at e641a6d and on PR #597; the
          # Federal Reserve's X9.37 standards reference PDF answered 403 on PR #610. Each passed on
          # a re-run minutes later, and every Monday sweep has checked them and passed. Retries cannot cure either: lychee retries a 5xx three times (the 3 s wait
          # below) and the archive's overload outlasted them, and it does not retry a 403 at all.
          # So, like the FSF page, each is checked by the weekly sweep and not on every PR and
          # push. Each pattern names its one URL, anchored at both ends, so a new link on any of
          # those hosts is checked everywhere.
          #
          # challenged: links a site's bot challenge goes on refusing, so unlike the four above a
          # re-run does not pass and a sweep could stay red for as long as it stands. A sweep that is
          # always red hides real link rot, so a link listed in scripts/challenged-links.mjs is
          # excluded on every event. Its un-mute signal is the sweep's last step, which fails when
          # lychee stops being refused. The script says what each answer means (#665).
          # An assignment, not echo "...$(...)": echo would succeed when the script fails, and an
          # empty exclude matches every link, so the check would pass having checked nothing.
          challenged=$(node scripts/challenged-links.mjs pattern)
          echo "challenged=$challenged" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'compare=^$' >> "$GITHUB_OUTPUT"
            echo 'release=^$' >> "$GITHUB_OUTPUT"
            echo 'stalling=^$' >> "$GITHUB_OUTPUT"
            echo 'refusing=^$' >> "$GITHUB_OUTPUT"
          else
            echo 'stalling=^https://www\.gnu\.org/licenses/gpl-faq\.html' >> "$GITHUB_OUTPUT"
            refusing='^https://www\.aba\.com/-/media/documents/reference-and-guides/routingnumberpolicy\.pdf$'
            refusing+='|^https://web\.archive\.org/web/20030411213628/http://sandeen\.net:80/GnuMICR/$'
            refusing+='|^https://web\.archive\.org/web/20070106015053/http://sandeen\.net:80/GnuMICR/download/GnuMICR-0\.30\.tar\.gz$'
            refusing+='|^https://www\.frbservices\.org/binaries/content/assets/crsocms/financial-services/check/setup/frb-x937-standards-reference\.pdf$'
            echo "refusing=$refusing" >> "$GITHUB_OUTPUT"
            echo "compare=^https://github\\.com/jwh3times/LeaseBook/compare/v${version}\\.\\.\\.HEAD$" >> "$GITHUB_OUTPUT"
            echo "release=^https://github\\.com/jwh3times/LeaseBook/releases/tag/v${version}$" >> "$GITHUB_OUTPUT"
          fi
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          # Authenticates github.com link checks (avoids rate-limit 403s).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail: true
          # Explicit include list = the tracked docs set (never node_modules/bin/obj strays).
          # --include-fragments validates intra-repo #anchor links.
          # localhost/loopback URLs are dev-runbook examples, not checkable links.
          # --max-concurrency: lychee defaults to 128, firing every link at once. Several docs
          # cite the same host repeatedly (CODE_OF_CONDUCT.md alone has five contributor-covenant.org
          # links), so the default turns one host into a burst of simultaneous connections from a
          # datacenter IP — which reads as scraping and gets the TCP connection reset rather than a
          # 429 we could accept. That is the failure this cap addresses: `Connection reset by peer
          # (os error 104)`, which failed three of four runs on PRs #233/#234 while the same URL
          # answered 301 from a laptop. 16 keeps the sweep well under a minute.
          #
          # --retry-wait-time: lychee already retries 3x, but at 1 s apart all three land inside the
          # same throttling window. 3 s spreads them across ~9 s instead.
          #
          # Deliberately NOT an --exclude: muting the URL would also stop reporting it when it
          # genuinely rots, and this repository does not add open-ended ignores without an un-mute
          # signal. If resets persist despite this, the next step is a scoped exclude PLUS a check
          # that fails when the excluded link starts working again. (The four event-scoped
          # excludes below are not open-ended: the weekly sweep checks every one of those URLs. The
          # `challenged` exclude applies to every event, the sweep included, and is that pattern:
          # the step after this one is its un-mute signal.)
          #
          # --remap github.com/<owner>/<repo>/blob/<ref>/<path> → raw.githubusercontent.com: GitHub's
          # rendered file page answers bots with a sustained 503 (every source-file citation failed on
          # main and on PR #485 for over an hour on 2026-10-02, and again from a laptop) while the
          # raw file answers 200. The raw URL still proves what the link claims — that file exists at
          # that ref — and answers 404 when it does not, so a citation that rots still fails. Not an
          # exclude: nothing stops being checked. (No cited blob link carries a #fragment.)
          args: >-
            --no-progress
            --include-fragments
            --max-concurrency 16
            --retry-wait-time 3
            --accept '200..=299, 429'
            --remap '^https://github\.com/([^/]+)/([^/]+)/blob/(.+)$ https://raw.githubusercontent.com/$1/$2/$3'
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '${{ steps.link-exclusions.outputs.compare }}'
            --exclude '${{ steps.link-exclusions.outputs.release }}'
            --exclude '${{ steps.link-exclusions.outputs.stalling }}'
            --exclude '${{ steps.link-exclusions.outputs.refusing }}'
            --exclude '${{ steps.link-exclusions.outputs.challenged }}'
            'README.md' 'CHANGELOG.md' 'CONTRIBUTING.md' 'SECURITY.md' 'SUPPORT.md'
            'CODE_OF_CONDUCT.md' 'AGENTS.md' 'CLAUDE.md'
            'docs/**/*.md' 'infra/**/*.md' '.github/**/*.md' '.claude/**/*.md'
      # Sweep only, and whether or not the check above passed: real link rot and a recovered link are
      # two separate findings, and one must not hide the other. The action above put lychee on the
      # PATH. It exits non-zero on any link it is refused by, which is the expected case here, so only
      # the script's reading of the report decides, and a run that wrote no report fails there. With
      # nothing listed, lychee has nothing to ask and the step passes.
      - name: Check lychee is still refused by the challenged links
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          node scripts/challenged-links.mjs urls > "$RUNNER_TEMP/challenged-links.txt"
          lychee --no-progress --verbose --retry-wait-time 3 --format json \
            --output "$RUNNER_TEMP/challenged-links.json" "$RUNNER_TEMP/challenged-links.txt" || true
          node scripts/challenged-links.mjs check "$RUNNER_TEMP/challenged-links.json"
