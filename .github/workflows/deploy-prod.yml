name: Deploy (prod)

# Manual, gated on the 'prod' environment's required reviewers. Promotes an already-built image
# (by digest/tag) and runs migrations before swapping the revision. Enablement is deferred until the
# operator configures prod OIDC + approvals (see Status Ledger).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (git SHA) already pushed to ACR by deploy-dev
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod # required reviewers gate this deployment
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Prod's Postgres is VNet-injected and has no public endpoint at all, so migrations cannot run
      # from a GitHub-hosted runner — there is nothing for it to connect to (ADR-027). They run
      # instead as a Container Apps Job inside the same environment, on the same VNet as the DB.
      #
      # The migrator image is built and pushed here rather than promoted from deploy-dev: dev
      # currently pushes only the app image. Both are tagged with the same SHA so the schema that
      # gets applied and the app that runs it are provably the same commit.
      - name: Build and push the migrator image
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_NAME.azurecr.io/leasebook-migrator:${{ inputs.image_tag }}"
          docker build --target migrator -t "$IMAGE" .
          docker push "$IMAGE"
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}

      # The job reads ConnectionStrings__Migrations as a Key Vault reference resolved by its own
      # managed identity, so the migrator credential never enters the workflow environment.
      #
      # `az containerapp job start` returns when the START succeeds, NOT when the migration
      # finishes, so the exit code of that command says nothing about whether the schema applied.
      # Polling to a terminal state is what makes this step meaningful; without it a failed
      # migration would look like a successful deploy and the app revision would roll on top of a
      # half-migrated schema.
      - name: Run migrations as a Container Apps Job
        run: |
          set -euo pipefail
          IMAGE="$ACR_NAME.azurecr.io/leasebook-migrator:${{ inputs.image_tag }}"

          # Every container field is passed, not just --image, and that is load-bearing.
          # `az containerapp job start` does NOT merge with the job's template: passing ANY container
          # flag makes it build a fresh single-container execution template out of exactly the flags
          # given and POST that. So `--image` alone produced an execution container that
          #   * was named after the JOB (`lb-prod-migrate`), not after the template container
          #     (`migrate`) — the CLI defaults the name to the job when --container-name is omitted;
          #   * carried NO env at all, so no ConnectionStrings__Migrations, so every prod migration
          #     would have started with no connection string;
          #   * carried no resources block.
          # The container name also has to be right for the log dump on the failure path below to
          # find anything: `job logs show --container` matches the EXECUTION's container name.
          # Snapshot the executions that already exist. The fallback below selects by DIFFERENCE
          # against this list, never by "most recent" — see the failure it prevents, below.
          az containerapp job execution list \
            --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
            --query '[].name' -o tsv > /tmp/executions-before.txt

          # The start's EXIT STATUS is captured separately from the name it prints, and a failure is
          # fatal here. Previously `|| true` swallowed it, and the fallback then picked the most
          # recently started execution — which on every deploy after the first is a *previous*,
          # already-Succeeded one. The step would report "Migrations applied.", exit 0 with no
          # migration having run, and the next step would roll the app revision onto an unmigrated
          # schema. That is precisely the outcome this whole job exists to make impossible, and the
          # start now has more ways to fail than it used to (bad cpu/memory pair, unresolvable secret
          # ref, container-name mismatch), so the swallow had to go.
          set +e
          EXECUTION=$(az containerapp job start \
            --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
            --container-name migrate \
            --image "$IMAGE" \
            --env-vars "ConnectionStrings__Migrations=secretref:connectionstrings-migrations" \
            --cpu 0.5 --memory 1.0Gi \
            --query 'name' -o tsv 2>/tmp/job-start.err)
          START_RC=$?
          set -e

          if [ "$START_RC" -ne 0 ]; then
            cat /tmp/job-start.err >&2 || true
            echo "::error::Could not start the migration job (az exited $START_RC). No migration ran and the app revision was NOT updated."
            exit 1
          fi

          # A successful start that did not populate the name field is still tolerated — but only by
          # finding an execution that did not exist a moment ago, so a stale one can never be adopted.
          if [ -z "${EXECUTION:-}" ] || [ "$EXECUTION" = "None" ]; then
            az containerapp job execution list \
              --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
              --query '[].name' -o tsv > /tmp/executions-after.txt
            EXECUTION=$(grep -Fxv -f /tmp/executions-before.txt /tmp/executions-after.txt | head -n 1 || true)
          fi

          if [ -z "${EXECUTION:-}" ] || [ "$EXECUTION" = "None" ]; then
            echo "::error::The migration job reported a successful start but no new execution appeared. Do not re-run blindly — inspect the job's executions first; a migration may be in flight."
            exit 1
          fi
          echo "Migration execution: $EXECUTION"

          # replicaTimeout on the job is 1800s; poll a little longer so a job the platform itself
          # timed out is reported by us as a failure rather than as a poll timeout.
          deadline=$(( SECONDS + 2100 ))
          while [ $SECONDS -lt $deadline ]; do
            STATUS=$(az containerapp job execution show \
              --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION" \
              --query 'properties.status' -o tsv)
            echo "  status=$STATUS"
            case "$STATUS" in
              Succeeded) echo "Migrations applied."; exit 0 ;;
              Failed|Degraded|Cancelled)
                echo "::error::Migration execution $EXECUTION ended as $STATUS — the app revision was NOT updated."
                # `job logs show` takes --execution (NOT --job-execution-name, which belongs to
                # `job execution show` above) and REQUIRES --container. Both were wrong here, and the
                # `|| true` hid it: the one command whose whole job is to explain a failed migration
                # was itself failing on argument parsing, leaving an operator with the ::error:: line
                # and nothing else. `|| true` is kept — a missing log must not mask the real failure —
                # but it is now covering only a genuinely absent log.
                #
                # `--container migrate` is correct only because the start above passes
                # `--container-name migrate`. Drop that flag and the execution's container is named
                # after the job, and this returns nothing again.
                az containerapp job logs show \
                  --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
                  --execution "$EXECUTION" --container migrate --tail 200 || true
                exit 1 ;;
            esac
            sleep 15
          done

          echo "::error::Timed out waiting for migration execution $EXECUTION. Do not re-run blindly — a partially applied migration must be inspected first."
          exit 1
        env:
          JOB_NAME: ${{ vars.MIGRATOR_JOB_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          # `containerapp job logs` lives in the preview `containerapp` CLI extension, unlike
          # `job start` / `job execution` which are core. A runner is non-interactive, so leave no
          # room for a prompt on the failure path.
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/leasebook:${{ inputs.image_tag }}"
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
